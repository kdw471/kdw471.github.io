<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MindFlow 마인드맵</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <button id="btnMenu" class="ib" aria-label="메뉴">☰</button>
  <button id="docTitle" class="title" aria-label="제목 변경">새 마인드맵</button>
  <div class="seg" id="viewSeg">
    <button data-view="map" class="on">맵</button>
    <button data-view="outline">개요</button>
  </div>
  <button id="btnUndo" class="ib" aria-label="실행 취소">↶</button>
  <button id="btnRedo" class="ib" aria-label="다시 실행">↷</button>
</header>

<main id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
  <div id="outline" hidden></div>
  <div id="hint"></div>
  <div id="zoomBtns">
    <button id="btnFit" class="fab small" aria-label="화면에 맞추기">⤢</button>
  </div>
</main>

<nav id="toolbar">
  <button data-act="child"><i>＋</i><span>하위</span></button>
  <button data-act="sibling"><i>↔</i><span>같은 레벨</span></button>
  <button data-act="edit"><i>✎</i><span>편집</span></button>
  <button data-act="rel"><i>⤳</i><span>연결선</span></button>
  <button data-act="delete"><i>🗑</i><span>삭제</span></button>
  <button data-act="more"><i>⋯</i><span>더보기</span></button>
</nav>

<!-- 편집 패널 (키보드와 겹치지 않게 화면 위쪽) -->
<div id="editor" hidden>
  <textarea id="editText" rows="2" enterkeyhint="done"></textarea>
  <div class="row">
    <button id="edCancel">취소</button>
    <span class="grow"></span>
    <button id="edSib">＋ 같은 레벨</button>
    <button id="edChild">＋ 하위</button>
    <button id="edOk" class="primary">확인</button>
  </div>
</div>

<div id="scrim" hidden></div>
<section id="sheet" hidden>
  <div class="grab"></div>
  <div class="tabs" id="sheetTabs"></div>
  <div id="sheetBody"></div>
</section>

<aside id="drawer" hidden>
  <div class="dhead">
    <b>내 마인드맵</b>
    <button id="drClose" class="ib">✕</button>
  </div>
  <div class="dactions">
    <button id="drNew" class="primary">＋ 새로 만들기</button>
    <label class="btn">가져오기<input id="fileIn" type="file" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></label>
  </div>
  <ul id="docList"></ul>
  <div class="dsect">
    <b>내보내기</b>
    <div class="chips">
      <button data-exp="png">PNG</button>
      <button data-exp="xmind">.xmind</button>
      <button data-exp="json">JSON</button>
      <button data-exp="md">Markdown</button>
    </div>
  </div>
</aside>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
